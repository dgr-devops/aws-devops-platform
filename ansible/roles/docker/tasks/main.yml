---
- name: Dependencias para el repositorio de Docker
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Directorio de claves APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clave GPG oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Repositorio APT de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Instalar Docker Engine y el plugin compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Habilitar y arrancar Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: ansible_service_mgr == "systemd"
